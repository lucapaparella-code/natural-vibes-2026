<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d2e2e"/>
      <stop offset="60%" stop-color="#061a1a"/>
      <stop offset="100%" stop-color="#010a0a"/>
    </radialGradient>
    <radialGradient id="tealglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e8d4" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#00c4b0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00a090" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealRing" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e0cc"/>
      <stop offset="100%" stop-color="#00b8a6"/>
    </radialGradient>
    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Ambient teal glow bloom -->
  <circle cx="512" cy="512" r="480" fill="url(#tealglow)"/>

  <!-- Teal ring with glow -->
  <circle cx="512" cy="512" r="342" fill="#00c8b8" filter="url(#outerGlow)" opacity="0.5"/>
  <circle cx="512" cy="512" r="342" fill="url(#tealRing)"/>

  <!-- Black pupil -->
  <circle cx="512" cy="512" r="258" fill="#000000"/>

  <!-- White highlight -->
  <circle cx="635" cy="385" r="78" fill="#ffffff"/>
</svg>
